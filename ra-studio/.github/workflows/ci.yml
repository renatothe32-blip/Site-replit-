name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Build API
        run: npm --workspace @ra-studio/api run build
      - name: Build Web
        run: npm --workspace @ra-studio/web run build
